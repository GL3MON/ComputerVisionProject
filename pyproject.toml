[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-vlm"
version = "0.1.0"
description = "Modular medical vision-language training, evaluation, and analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=2,<4", "Pillow>=10", "PyYAML>=6", "requests>=2", "tqdm>=4", "datasets>=4,<6", "huggingface-hub>=0.36"]

[project.optional-dependencies]
training = ["torch>=2.6", "transformers>=5.6,<6", "peft>=0.20", "accelerate>=1", "trl>=0.26", "wandb>=0.20"]
vision = ["torch>=2.6", "transformers>=5.6,<6", "peft>=0.20", "numpy>=1.26", "medmnist>=3", "scikit-learn>=1.4", "matplotlib>=3.8"]
serving = ["vllm>=0.22", "transformers>=5.6,<6"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
medical-vlm = "medical_vlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
