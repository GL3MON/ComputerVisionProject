# Example config for train_qwen3vl_medical_lora.py
# Run with: python train_qwen3vl_medical_lora.py --config config.example.yaml
#
# Any field omitted here falls back to the script's built-in defaults —
# you only need to list what you want to override.

model_name: "Qwen/Qwen3-VL-2B-Thinking"
dataset_name: "FreedomIntelligence/medical-o1-reasoning-SFT"
output_dir: "./outputs/qwen3-vl-2b-medical-lora"
max_length: 4096

wandb_project: "qwen3-vl-medical-lora"
wandb_run_name: "qwen3-vl-2b-medical-lora-r16"

eval_split_ratio: 0.02   # 98% train / 2% eval

generation:
  max_new_tokens: 2048

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training_args:
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: "adamw_torch_fused"
  logging_strategy: "steps"
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 2
  eval_strategy: "steps"
  eval_steps: 500
  per_device_eval_batch_size: 1
  remove_unused_columns: false
  dataloader_num_workers: 2
  max_grad_norm: 1.0
  ddp_find_unused_parameters: false
  save_safetensors: true